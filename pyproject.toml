[project]
name = "kuick-pic"
version = "0.1.0"
description = "KDE/Plasma-oriented quick screenshot tool (tray, hotkey, pin)"
requires-python = ">=3.10"
dependencies = [
    "mss>=10.0.0",
    "pynput>=1.7.7",
    "Pillow>=10.0.0",
]

[project.scripts]
kuick-pic = "kuick_pic.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = [
    "kuick_pic",
    "CLAUDE.md",
    "scripts/*.sh",
]

[tool.hatch.build.targets.wheel]
packages = ["kuick_pic"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
]
