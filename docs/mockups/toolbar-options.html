<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KQuick Pic Toolbar Options</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --ink: #1f2933;
      --muted: #64707d;
      --blue: #2563eb;
      --red: #ef4444;
      --green: #16a34a;
      --amber: #d97706;
      --panel: rgba(255, 255, 255, 0.94);
      --line: rgba(25, 34, 44, 0.13);
      --shadow: 0 18px 42px rgba(16, 24, 40, 0.22);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #eef2f6;
      color: var(--ink);
    }

    header {
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px 24px 12px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.2;
      font-weight: 720;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    main {
      display: grid;
      grid-template-columns: repeat(3, minmax(280px, 1fr));
      gap: 18px;
      max-width: 1180px;
      margin: 0 auto;
      padding: 18px 24px 36px;
    }

    .option {
      background: white;
      border: 1px solid rgba(23, 36, 52, 0.10);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 12px 28px rgba(31, 41, 51, 0.08);
    }

    .stage {
      position: relative;
      min-height: 330px;
      background:
        linear-gradient(90deg, rgba(255,255,255,.12) 1px, transparent 1px) 0 0 / 32px 32px,
        linear-gradient(rgba(255,255,255,.12) 1px, transparent 1px) 0 0 / 32px 32px,
        linear-gradient(135deg, #3d4f61 0%, #8298a7 45%, #d3c2a3 100%);
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.42);
    }

    .selection {
      position: absolute;
      left: 14%;
      top: 23%;
      width: 72%;
      height: 47%;
      border: 2px solid rgba(255,255,255,.92);
      box-shadow: 0 0 0 999px rgba(0,0,0,.04) inset;
    }

    .selection::after {
      content: "③";
      position: absolute;
      right: 20%;
      top: 28%;
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border: 3px solid #ef4444;
      border-radius: 50%;
      color: #ef4444;
      font-weight: 800;
      text-shadow: 0 1px 1px rgba(0,0,0,.45);
    }

    .meta {
      padding: 14px 15px 16px;
      border-top: 1px solid rgba(23, 36, 52, 0.08);
    }

    h2 {
      margin: 0 0 6px;
      font-size: 15px;
      line-height: 1.25;
      font-weight: 720;
      letter-spacing: 0;
    }

    .toolbar {
      position: absolute;
      left: 50%;
      bottom: 34px;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      user-select: none;
      white-space: nowrap;
    }

    .group {
      display: flex;
      align-items: center;
    }

    .tool {
      display: inline-grid;
      place-items: center;
      border: 0;
      color: inherit;
      font: inherit;
      background: transparent;
      letter-spacing: 0;
    }

    .swatch {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #ef4444;
    }

    .label {
      font-size: 10px;
      font-weight: 650;
    }

    .sep {
      width: 1px;
      align-self: stretch;
      background: var(--line);
      margin: 0 4px;
    }

    .pro .toolbar {
      gap: 6px;
      padding: 7px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      color: #202b36;
    }

    .pro .group { gap: 3px; }

    .pro .tool {
      width: 36px;
      height: 32px;
      border-radius: 6px;
      font-size: 17px;
    }

    .pro .tool.active {
      color: white;
      background: #2563eb;
      box-shadow: inset 0 -1px 0 rgba(0,0,0,.18);
    }

    .pro .tool.confirm {
      color: white;
      background: #059669;
    }

    .pro .tool.cancel {
      color: #b42318;
      background: rgba(239, 68, 68, 0.10);
    }

    .glass .toolbar {
      gap: 7px;
      padding: 8px 9px;
      border: 1px solid rgba(255,255,255,.42);
      border-radius: 8px;
      background: rgba(25, 32, 41, 0.68);
      box-shadow: 0 22px 50px rgba(0,0,0,.32);
      color: white;
      backdrop-filter: blur(18px) saturate(1.25);
    }

    .glass .group { gap: 5px; }

    .glass .tool {
      width: 38px;
      height: 36px;
      border-radius: 6px;
      color: rgba(255,255,255,.88);
      font-size: 17px;
    }

    .glass .tool.active {
      color: #111827;
      background: rgba(255,255,255,.94);
    }

    .glass .tool.confirm {
      color: white;
      background: #16a34a;
    }

    .glass .tool.cancel {
      color: white;
      background: rgba(239,68,68,.86);
    }

    .compact .toolbar {
      flex-direction: column;
      gap: 6px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,.96);
      box-shadow: var(--shadow);
      color: #1f2933;
      left: auto;
      right: 24px;
      bottom: 28px;
      transform: none;
    }

    .compact .group {
      gap: 4px;
      width: 100%;
      justify-content: center;
    }

    .compact .tool {
      min-width: 34px;
      height: 32px;
      border-radius: 6px;
      font-size: 16px;
    }

    .compact .tool.active {
      color: white;
      background: #334155;
    }

    .compact .tool.confirm {
      color: white;
      background: #15803d;
      padding: 0 10px;
    }

    .compact .tool.cancel {
      color: white;
      background: #dc2626;
      padding: 0 10px;
    }

    .compact .sep {
      width: 100%;
      height: 1px;
      margin: 1px 0;
    }

    @media (max-width: 980px) {
      main { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>KQuick Pic 工具栏方向选择</h1>
    <p>三个方案都保留现有功能，只调整视觉层级、分组、按钮状态和紧凑度。请选 A / B / C，也可以指出你想混合的部分。</p>
  </header>

  <main>
    <section class="option pro">
      <div class="stage">
        <div class="selection"></div>
        <div class="toolbar" aria-label="A toolbar">
          <div class="group">
            <button class="tool">□</button>
            <button class="tool">T</button>
            <button class="tool">╱</button>
            <button class="tool">→</button>
            <button class="tool active">①</button>
          </div>
          <div class="sep"></div>
          <button class="tool"><span class="swatch"></span></button>
          <button class="tool">↶</button>
          <div class="sep"></div>
          <button class="tool confirm">✓</button>
          <button class="tool cancel">×</button>
        </div>
      </div>
      <div class="meta">
        <h2>A. 专业轻量</h2>
        <p>白色悬浮面板，图标为主，分组清楚。最像截图/标注工具，稳定、清晰、不会抢画面。</p>
      </div>
    </section>

    <section class="option glass">
      <div class="stage">
        <div class="selection"></div>
        <div class="toolbar" aria-label="B toolbar">
          <div class="group">
            <button class="tool">□</button>
            <button class="tool">T</button>
            <button class="tool">╱</button>
            <button class="tool">→</button>
            <button class="tool active">①</button>
          </div>
          <div class="sep"></div>
          <button class="tool"><span class="swatch"></span></button>
          <button class="tool">↶</button>
          <div class="sep"></div>
          <button class="tool confirm">✓</button>
          <button class="tool cancel">×</button>
        </div>
      </div>
      <div class="meta">
        <h2>B. 深色玻璃</h2>
        <p>暗色半透明，和截图遮罩融合更强。高级感更明显，但在深色截图上可读性需要更仔细处理。</p>
      </div>
    </section>

    <section class="option compact">
      <div class="stage">
        <div class="selection"></div>
        <div class="toolbar" aria-label="C toolbar">
          <div class="group">
            <button class="tool">□</button>
            <button class="tool">T</button>
            <button class="tool">╱</button>
          </div>
          <div class="group">
            <button class="tool">→</button>
            <button class="tool active">①</button>
            <button class="tool"><span class="swatch"></span></button>
          </div>
          <div class="sep"></div>
          <div class="group">
            <button class="tool">↶</button>
            <button class="tool confirm">✓</button>
            <button class="tool cancel">×</button>
          </div>
        </div>
      </div>
      <div class="meta">
        <h2>C. 紧凑分组</h2>
        <p>竖向小面板，适合选区底部空间不足时使用。效率高，但和常见截图工具横向工具栏不太一样。</p>
      </div>
    </section>
  </main>
</body>
</html>
